<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Задание 5 - Three.js UI + HDRI</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; z-index: 100; pointer-events: none; font-size: 16px; text-shadow: 1px 1px 2px black; }
        /* Стили для панели управления */
        #ui-panel {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: white; padding: 10px;
            border-radius: 10px; display: none; /* Скрыта до входа в AR */
            z-index: 200; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        #ui-panel button, #ui-panel input {
            padding: 8px 12px; border-radius: 5px; border: none; cursor: pointer;
        }
        #ui-panel button { background: #007bff; color: white; font-weight: bold; }
        #ui-panel input[type="color"] { width: 50px; height: 40px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Наведите камеру на пол и нажмите, чтобы поставить объект</div>
    
    <!-- Панель управления -->
    <div id="ui-panel">
        <input type="color" id="colorPicker" value="#ff0000" title="Цвет объекта">
        <button id="rotateBtn">Вращать</button>
        <button id="resetBtn">Сброс</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        let container, camera, scene, renderer;
        let controller, reticle, placedObject = null;
        let hitTestSource = null, hitTestSourceRequested = false;
        let isRotating = false;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            // 1. HDRI-освещение (environment map)
            new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture; // Освещает PBR-материалы
                // scene.background = texture; // Если раскомментировать, HDRI станет фоном (не рекомендуется в AR)
            });

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // Для HDRI
            container.appendChild(renderer.domElement);

            // Кнопка AR
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            document.body.appendChild(arButton);

            // Показываем панель управления при входе в AR
            arButton.addEventListener('click', () => {
                document.getElementById('ui-panel').style.display = 'flex';
            });

            // 2. UI-элементы
            setupUI();

            // 3. Контроллер и Hit-Test
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00ff00 }) // Зеленое кольцо
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize, false);
        }

        // 4. Создание PBR-материала (MeshStandardMaterial)
        function createPBRMaterial(color = 0xff0000) {
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3, // Шероховатость (0 - гладкий, 1 - матовый)
                metalness: 0.7  // Металличность (0 - диэлектрик, 1 - металл)
            });
        }

        function onSelect() {
            if (reticle.visible) {
                // Если объект уже есть, удаляем его (чтобы не плодить копии)
                if (placedObject) scene.remove(placedObject);

                const geometry = new THREE.CylinderGeometry(0.1, 0.1, 0.2, 32).translate(0, 0.1, 0);
                const material = createPBRMaterial(0xff0000);
                placedObject = new THREE.Mesh(geometry, material);
                
                placedObject.position.setFromMatrixPosition(reticle.matrix);
                scene.add(placedObject);

                // Показываем панель управления
                document.getElementById('ui-panel').style.display = 'flex';
            }
        }

        // 5. Настройка UI
        function setupUI() {
            const colorPicker = document.getElementById('colorPicker');
            const rotateBtn = document.getElementById('rotateBtn');
            const resetBtn = document.getElementById('resetBtn');

            // Смена цвета
            colorPicker.addEventListener('input', (e) => {
                if (placedObject) {
                    placedObject.material.color.set(e.target.value);
                }
            });

            // Вращение
            rotateBtn.addEventListener('click', () => {
                isRotating = !isRotating;
                rotateBtn.textContent = isRotating ? 'Стоп' : 'Вращать';
            });

            // Сброс (удаление объекта)
            resetBtn.addEventListener('click', () => {
                if (placedObject) {
                    scene.remove(placedObject);
                    placedObject = null;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            // Вращение объекта
            if (isRotating && placedObject) {
                placedObject.rotation.y += 0.02;
            }

            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((space) => {
                        session.requestHitTestSource({ space }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        document.getElementById('ui-panel').style.display = 'none';
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
