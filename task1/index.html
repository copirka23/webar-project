<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 - model-viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; text-align: center; }
        model-viewer { width: 100%; max-width: 600px; height: 500px; margin: 0 auto; }
        .ar-button { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 30px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Задание 1: WebAR</h1>
    <model-viewer 
        src="model.glb" 
        ios-src="model.usdz" 
        alt="3D модель"
        ar 
        ar-modes="webxr scene-viewer quick-look"
        environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
        shadow-intensity="1"
        camera-controls>
        <button slot="ar-button" class="ar-button">👋 Разместить в AR</button>
    </model-viewer>
</body>
</html>
