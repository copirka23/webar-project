<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Очки</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        a-scene {
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font: 16px Arial;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="status">Загрузка AR...</div>

<a-scene
    mindar-face="autoStart: true"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
        <a-asset-item
            id="glasses"
            src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf">
        </a-asset-item>
    </a-assets>

    <a-camera
        active="false"
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-face-target="anchorIndex: 168">

        <a-gltf-model
            src="#glasses"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.01 0.01 0.01">
        </a-gltf-model>

    </a-entity>

</a-scene>

<script>
    const scene = document.querySelector('a-scene');
    const status = document.querySelector('#status');

    scene.addEventListener('arReady', () => {
        status.textContent = 'Наведите камеру на лицо';
    });

    scene.addEventListener('arError', (event) => {
        status.textContent = 'Ошибка запуска камеры AR';
        console.error(event);
    });

    scene.addEventListener('loaded', () => {
        console.log('A-Frame загружен');
    });
</script>

</body>
</html>
