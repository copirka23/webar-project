<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Tracking - Очки</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <a-scene
        mindar-face="autoStart: true"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Заменили .gltf на .glb для стабильной загрузки -->
            <a-asset-item
                id="glasses"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.glb">
            </a-asset-item>
        </a-assets>

        <a-camera
            active="false"
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity mindar-face-target="anchorIndex: 168">
            <a-gltf-model
                src="#glasses"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.01 0.01 0.01">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
